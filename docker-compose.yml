version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ielts_postgres
    environment:
      POSTGRES_DB: ielts_coach
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ielts_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/ielts_coach
      - JWT_SECRET=ielts_ai_coach_super_secure_jwt_secret_key_2026
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ielts_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
